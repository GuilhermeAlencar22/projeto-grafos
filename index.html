<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto de Grafos</title>
  <style>
    :root {
      --bg: #101010;
      --panel: #171717;
      --border: #333333;
      --text: #f5f5f5;
      --muted: #b7b7b7;
      --yellow: #f5c518;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(920px, calc(100% - 40px));
    }

    .tag {
      display: inline-block;
      padding: 8px 12px;
      margin-bottom: 18px;
      background: var(--yellow);
      color: #111;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 6px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 62px);
      line-height: 1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      max-width: 720px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 38px;
    }

    a.card {
      display: block;
      min-height: 190px;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: transform 160ms ease, border-color 160ms ease;
    }

    a.card:hover {
      transform: translateY(-3px);
      border-color: var(--yellow);
    }

    .card strong {
      display: block;
      margin-bottom: 12px;
      color: var(--yellow);
      font-size: 14px;
      text-transform: uppercase;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .card span {
      color: var(--muted);
      line-height: 1.45;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">teoria dos grafos</span>
    <h1>Lobby do Projeto</h1>

    <section class="grid" aria-label="partes do projeto">
      <a class="card" href="interface/parte1.html">
        <strong>parte 1</strong>
        <h2>Aeroportos</h2>
        <span>Metricas, rotas, grafo interativo, arvore de percurso e graficos analiticos da rede brasileira.</span>
      </a>

      <a class="card" href="interface/">
        <strong>parte 2</strong>
        <h2>IMDb</h2>
        <span>Dataset maior, BFS, DFS, Dijkstra, Bellman-Ford, benchmark e visualizacao interativa dos filmes.</span>
      </a>
    </section>
  </main>
</body>
</html>
